<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Service - Ekstrak Teks dari PDF/Gambar</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { color: var(--accent); }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display:block; margin: 8px 0 4px; color: var(--muted); }
    input, select, textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0b1220; color:var(--text); }
    button { background: var(--accent); color:#0f172a; border:none; padding:12px 20px; border-radius:8px; font-weight:600; cursor:pointer; margin-top:12px; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .row > * { flex:1; min-width:200px; }
    pre { white-space: pre-wrap; word-break: break-word; background:#0b1220; padding:12px; border-radius:8px; max-height:400px; overflow:auto; }
    .status { color: var(--muted); margin-top:8px; }
    .page { border-top:1px solid #334155; padding-top:12px; margin-top:12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>OCR Service</h1>
    <p>Ekstrak teks dari gambar atau PDF (termasuk PDF scan) menggunakan Tesseract + PyMuPDF.</p>

    <div class="card">
      <form id="form">
        <label>File (gambar/PDF)</label>
        <input type="file" id="file" accept="image/*,.pdf" required />

        <div class="row">
          <div>
            <label>Bahasa</label>
            <select id="lang">
              <option value="eng">English (eng)</option>
            </select>
          </div>
          <div>
            <label>DPI (PDF)</label>
            <input type="number" id="dpi" value="200" min="100" max="400" />
          </div>
          <div>
            <label>Force OCR (PDF)</label>
            <select id="force">
              <option value="false">false</option>
              <option value="true">true</option>
            </select>
          </div>
        </div>

        <button id="btn" type="submit">Proses</button>
        <div class="status" id="status"></div>
      </form>
    </div>

    <div class="card">
      <h3>Hasil</h3>
      <div id="result"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('file').files[0];
      if (!file) return;
      btn.disabled = true;
      status.textContent = 'Memproses...';
      result.innerHTML = '';

      const fd = new FormData();
      fd.append('file', file);
      fd.append('lang', document.getElementById('lang').value);
      fd.append('dpi', document.getElementById('dpi').value);
      fd.append('force_ocr', document.getElementById('force').value);

      const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';
      const endpoint = isPdf ? '/ocr/pdf' : '/ocr/image';

      try {
        const res = await fetch(endpoint, { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Gagal');

        if (isPdf) {
          let html = `<p><b>${data.filename}</b> — ${data.pages.length} halaman, ${data.total_chars} karakter</p>`;
          data.pages.forEach(p => {
            html += `<div class="page"><h4>Halaman ${p.page} <small>(${p.method}, ${p.char_count} char)</small></h4><pre>${escapeHtml(p.text)}</pre></div>`;
          });
          result.innerHTML = html;
        } else {
          result.innerHTML = `<p><b>${data.filename}</b> — ${data.char_count} karakter</p><pre>${escapeHtml(data.text)}</pre>`;
        }
        status.textContent = 'Selesai.';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    function escapeHtml(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
